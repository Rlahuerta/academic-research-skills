name: Skill Self-Evolution (Trace2Skill)

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'LLM model for ReAct analyst'
        required: false
        default: 'gpt-4o-mini'
        type: string
      max_turns:
        description: 'Max ReAct loop turns per proposal'
        required: false
        default: '5'
        type: string
  schedule:
    # Weekly: Monday 07:00 UTC — self-improvement run against golden evaluation set
    - cron: "0 7 * * 1"
  push:
    paths:
      - 'scientific-brainstormer/scripts/evaluate_ideas.py'
      - 'scientific-brainstormer/scripts/merge_patches.py'
      - 'scientific-brainstormer/references/failure_modes.md'
      - 'scientific-brainstormer/templates/*.md'
      - 'scientific-brainstormer/SKILL.md'
      - 'scientific-brainstormer/tests/golden_set/*.md'

concurrency:
  group: skill-evolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt litellm

      - name: Run heuristic evaluation (no API key required)
        run: |
          python scientific-brainstormer/scripts/evaluate_ideas.py \
            --proposals-dir scientific-brainstormer/tests/golden_set \
            --skill-dir scientific-brainstormer \
            --model "${{ inputs.model || 'gpt-4o-mini' }}" \
            --max-turns "${{ inputs.max_turns || '5' }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true

      - name: Consolidate and apply patches
        run: |
          python scientific-brainstormer/scripts/merge_patches.py \
            --skill-dir scientific-brainstormer \
            --batch-size 4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true

      - name: Report evolution results
        run: |
          echo "## Skill Evolution Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f scientific-brainstormer/output/success_traces.json ]; then
            successes=$(python3 -c "import json; d=json.load(open('scientific-brainstormer/output/success_traces.json')); print(len(d))")
            echo "- Successes (T⁺): $successes" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f scientific-brainstormer/output/failure_traces.json ]; then
            failures=$(python3 -c "import json; d=json.load(open('scientific-brainstormer/output/failure_traces.json')); print(len(d))")
            echo "- Failures (T⁻): $failures" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** If SKILL.md was modified by this run, review the changes and commit them manually or via PR." >> $GITHUB_STEP_SUMMARY

      - name: Check for SKILL.md changes
        id: check_changes
        run: |
          if git diff --quiet scientific-brainstormer/SKILL.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to SKILL.md — skill is up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "SKILL.md was modified by self-evolution. Review changes before committing."
          fi

      - name: Create Pull Request with evolved skill changes
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat(scientific-brainstormer): automated skill evolution from golden set evaluation"
          title: "🤖 [Automated] Scientific Brainstormer Self-Evolution"
          body: |
            This PR contains automated improvements to the `scientific-brainstormer` skill generated by the Trace2Skill self-evolution pipeline.

            **Process:**
            1. Ran `evaluate_ideas.py` against the golden evaluation set (scientific-brainstormer/tests/golden_set/)
            2. Consolidated failure traces via `merge_patches.py` with hierarchical merge
            3. Applied validated improvements to SKILL.md

            **Review checklist:**
            - [ ] Verify new guidelines are coherent and non-redundant
            - [ ] Confirm no regressions — run the golden set manually if unsure
            - [ ] Check that all markdown formatting is valid

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          branch: auto/skill-evolution
          branch-suffix: timestamp
          delete-branch: true
